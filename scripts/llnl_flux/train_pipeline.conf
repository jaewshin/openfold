#!/usr/bin/env bash

SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
repo_root="$(cd "${SCRIPT_DIR}/../.." && pwd)"

if [ ! -f "${repo_root}/scripts/retrieval/train_retrieval_modular.py" ]; then
  echo "Error: Expected OpenFold repo root at '${repo_root}'" >&2
  return 1 2>/dev/null || exit 1
fi

outdir="${OPENFOLD_FLUX_OUTDIR:-${repo_root}/logs/flux_runs}"
flux_log_dir="${OPENFOLD_FLUX_FLUX_LOG_DIR:-${outdir}/flux_logs}"
local_scratch_root="${OPENFOLD_FLUX_LOCAL_ROOT:-/l/ssd/${USER}/openfold}"

mkdir -p "${outdir}" "${flux_log_dir}"

devices_per_node=4

default_queue="pbatch"
default_pdebug_time="1h"
default_pbatch_time="24h"
pdebug_safety_margin=5
pbatch_safety_margin=15

rocm_version="${OPENFOLD_FLUX_ROCM_VERSION:-6.4.2}"
rocm_version_dir="${OPENFOLD_FLUX_ROCM_VERSION_DIR:-rocm-6.4.2}"
conda_env_path="${OPENFOLD_FLUX_CONDA_ENV:-/insomnia001/depts/pmg/users/js6118/miniforge3/envs/openfold_dev}"
bashrc_path="${OPENFOLD_FLUX_BASHRC:-$HOME/.bashrc}"
aws_ofi_rccl_dir="${OPENFOLD_FLUX_AWS_OFI_RCCL_DIR:-}"

manifest_path="${OPENFOLD_FLUX_MANIFEST_PATH:-/insomnia001/depts/pmg/users/js6118/data/retrieval/openproteinnet/retrieval_ready/manifest.jsonl}"
seq_index_path="${OPENFOLD_FLUX_SEQ_INDEX_PATH:-/insomnia001/depts/pmg/users/js6118/data/uniref/uniref50/index/u50_esm2_35M.index}"
seq_index_ids_path="${OPENFOLD_FLUX_SEQ_INDEX_IDS_PATH:-/insomnia001/depts/pmg/users/js6118/data/uniref/uniref50/index/u50_esm2_35M_ids.txt}"
seq_db_fasta_path="${OPENFOLD_FLUX_SEQ_DB_FASTA_PATH:-/insomnia001/depts/pmg/users/js6118/data/uniref/uniref50/uniref50.fasta}"
seq_db_fasta_index_db="${OPENFOLD_FLUX_SEQ_DB_FASTA_INDEX_DB:-/insomnia001/depts/pmg/users/js6118/data/uniref/uniref50/uniref50.seqio.sqlite}"
openfold_checkpoint_path="${OPENFOLD_FLUX_OPENFOLD_CKPT:-/insomnia001/depts/pmg/users/js6118/openfold/resources/openfold_soloseq_params/seq_model_esm1b_ptm.pt}"
esm2_model_path="${OPENFOLD_FLUX_ESM2_MODEL_PATH:-/insomnia001/depts/pmg/users/js6118/.cache/torch/hub/checkpoints/esm2_t12_35M_UR50D.pt}"
esm2_regression_path="${OPENFOLD_FLUX_ESM2_REGRESSION_PATH:-/insomnia001/depts/pmg/users/js6118/.cache/torch/hub/checkpoints/esm2_t12_35M_UR50D-contact-regression.pt}"
esm1b_safetensors_path="${OPENFOLD_FLUX_ESM1B_SAFETENSORS_PATH:-/insomnia001/depts/pmg/users/js6118/hf_cache/hub/models--mhcelik--esm-efficient/snapshots/48bfb7a279257ea8645aad96da4314a88a2341d5/esm1b.safetensors}"

wandb_entity="${OPENFOLD_WANDB_ENTITY:-jshin}"
wandb_project="${OPENFOLD_WANDB_PROJECT:-openfold-retrieval}"
