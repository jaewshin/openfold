defaults:
  - fusion/simple_cross_attn.yaml
  - injection/input_only.yaml
  - pipeline/legacy.yaml
  - train/frozen_backbone.yaml

model:
  config_preset: seqemb_initial_training
  openfold_checkpoint: null
  openfold_checkpoint_search_globs:
    - outputs/**/*.ckpt
    - checkpoints/**/*.ckpt
    - logs/**/*.ckpt
  auto_disable_resolution_gated_losses: true
  resolution_gated_loss_warmup_steps: 128
  low_prec: false
  use_flash: false

retrieval:
  seq_embedding_dim: 1280
  top_k: 8
  nprobe: 64
  ablation: both
  sources:
    seq:
      index_path: null
      index_dim: 1280
    struct:
      index_path: null
      index_dim: 512
  embed_project:
    retriever_esm2_model_name: esm2_t12_35M_UR50D
    retriever_esm2_repr_layer: 12
    retriever_esm2_max_len: 1022
    retriever_tmvec_checkpoint: null
    retriever_tmvec_max_len: 1022
    retriever_normalize_queries: true
  rawseq_esm1b:
    seq_index_ids_path: null
    seq_db_fasta_path: null
    seq_db_fasta_index_db: null
    esm1b_model_name: esm1b_t33_650M_UR50S
    esm1b_repr_layer: 33
    esm1b_max_len: 1022
    backend: fair_esm
    fallback_backend: null
    allow_download: true
    hf_cache_dir: null
    torch_hub_dir: null
    use_pretrained: true
    compute_dtype: bfloat16
    esm1b_tuning_mode: lora
    lora_rank: 8
    lora_alpha: 16.0
    lora_dropout: 0.0
    lora_target_modules: [self_attn.q_proj, self_attn.v_proj, self_attn.out_proj, fc1, fc2]
    train_layer_norm: false

data:
  packed_dataset_dir: null
  dataset_dir: null
  manifest_path: null
  write_manifest_to: null
  seq_embedding_dir: null
  config_preset: seqemb_initial_training
  batch_size: 1
  num_workers: 5
  disable_templates: true
  max_recycling_iters: 0
  strict_seq_embeddings: false

optimizer:
  lr: 1.0e-4
  controller_lr: null
  backbone_lr: null

train:
  seed: 42

trainer:
  output_dir: ./outputs/retrieval_modular
  accelerator: auto
  devices: 1
  num_nodes: 1
  strategy: auto
  precision: "32"
  max_epochs: 1
  max_steps: null
  max_time: null
  val_check_interval: 1000
  accumulate_grad_batches: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 25
  enable_checkpointing: true
  resume_ckpt_path: null
  checkpoint:
    dirpath: null
    every_n_train_steps: 500
    save_last: true
    save_top_k: -1
    filename: "step={step}"
    save_on_train_epoch_end: false

wandb:
  enabled: false
  project: openfold-retrieval
  entity: jshin
  run_name: null
  run_id: null
  resume: allow
  api_key_env: WANDB_API_KEY
  api_key: null
  offline: false
  tags: null
